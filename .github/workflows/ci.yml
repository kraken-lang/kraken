name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm_path: /usr/lib/llvm-18
          - os: macos-latest
            llvm_path: /opt/homebrew/opt/llvm@18
          - os: windows-latest
            llvm_path: C:\LLVM
    runs-on: ${{ matrix.os }}
    env:
      LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 zstd
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install LLVM 18 and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libzstd-dev libpolly-18-dev

      - name: Install LLVM 18 and dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Downloading LLVM 18.1.8..."
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe"
          $llvmInstaller = "$env:TEMP\LLVM-18.1.8-win64.exe"
          Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmInstaller
          
          Write-Host "Installing LLVM to C:\LLVM (path without spaces)..."
          Start-Process -FilePath $llvmInstaller -ArgumentList "/S","/D=C:\LLVM" -Wait -NoNewWindow
          
          Write-Host "Verifying LLVM installation..."
          $possiblePaths = @(
            "C:\LLVM"
          )
          
          $llvmPath = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $llvmPath = $path
              Write-Host "LLVM found at: $llvmPath"
              break
            }
          }
          
          if (-not $llvmPath) {
            Write-Host "ERROR: LLVM installation not found"
            exit 1
          }
          
          Write-Host "Setting LLVM_SYS_180_PREFIX to $llvmPath"
          echo "LLVM_SYS_180_PREFIX=$llvmPath" >> $env:GITHUB_ENV
          
          Write-Host "Adding LLVM to PATH"
          echo "$llvmPath\bin" >> $env:GITHUB_PATH

      - name: Verify LLVM environment (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "LLVM_SYS_180_PREFIX = $env:LLVM_SYS_180_PREFIX"
          Write-Host "Checking if llvm-config exists..."
          if (Test-Path "$env:LLVM_SYS_180_PREFIX\bin\llvm-config.exe") {
            Write-Host "llvm-config.exe found"
          } else {
            Write-Host "llvm-config.exe NOT found"
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and dependencies
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libzstd-dev libpolly-18-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-release:
    name: Release Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm_path: /usr/lib/llvm-18
          - os: macos-latest
            llvm_path: /opt/homebrew/opt/llvm@18
          - os: windows-latest
            llvm_path: C:\LLVM
    runs-on: ${{ matrix.os }}
    env:
      LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 zstd
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install LLVM 18 and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libzstd-dev libpolly-18-dev

      - name: Install LLVM 18 and dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Downloading LLVM 18.1.8..."
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe"
          $llvmInstaller = "$env:TEMP\LLVM-18.1.8-win64.exe"
          Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmInstaller
          
          Write-Host "Installing LLVM to C:\LLVM (path without spaces)..."
          Start-Process -FilePath $llvmInstaller -ArgumentList "/S","/D=C:\LLVM" -Wait -NoNewWindow
          
          Write-Host "Verifying LLVM installation..."
          $possiblePaths = @(
            "C:\LLVM"
          )
          
          $llvmPath = $null
          foreach ($path in $possiblePaths) {
            if (Test-Path $path) {
              $llvmPath = $path
              Write-Host "LLVM found at: $llvmPath"
              break
            }
          }
          
          if (-not $llvmPath) {
            Write-Host "ERROR: LLVM installation not found"
            exit 1
          }
          
          Write-Host "Setting LLVM_SYS_180_PREFIX to $llvmPath"
          echo "LLVM_SYS_180_PREFIX=$llvmPath" >> $env:GITHUB_ENV
          
          Write-Host "Adding LLVM to PATH"
          echo "$llvmPath\bin" >> $env:GITHUB_PATH

      - name: Verify LLVM environment (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "LLVM_SYS_180_PREFIX = $env:LLVM_SYS_180_PREFIX"
          Write-Host "Checking if llvm-config exists..."
          if (Test-Path "$env:LLVM_SYS_180_PREFIX\bin\llvm-config.exe") {
            Write-Host "llvm-config.exe found"
          } else {
            Write-Host "llvm-config.exe NOT found"
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --workspace --release

  no-regressions:
    name: No Regressions Gate
    runs-on: macos-latest
    needs: [test, lint]
    steps:
      - name: All checks passed
        run: echo "✅ No regressions detected. All tests and lints passed."
