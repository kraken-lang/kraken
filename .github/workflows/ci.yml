name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm_path: /usr/lib/llvm-18
          - os: macos-latest
            llvm_path: /opt/homebrew/opt/llvm@18
          - os: windows-latest
            llvm_path: C:\llvm-18.1.8-windows-amd64-msvc17-msvcrt
    runs-on: ${{ matrix.os }}
    env:
      LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 zstd
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install LLVM 18 and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libzstd-dev libpolly-18-dev

      - name: Install LLVM 18 and dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Downloading LLVM 18.1.8 pre-built package with dev files..."
          $llvmUrl = "https://github.com/vovkos/llvm-package-windows/releases/download/llvm-18.1.8/llvm-18.1.8-windows-amd64-msvc17-msvcrt.7z"
          $llvmArchive = "$env:TEMP\llvm-18.1.8.7z"
          Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmArchive
          
          Write-Host "Extracting LLVM to C:\..."
          7z x $llvmArchive -oC:\\ -y
          
          Write-Host "Verifying LLVM installation..."
          if (Test-Path "C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt") {
            Write-Host "LLVM extracted successfully"
            
            Write-Host "Checking for llvm-config.exe..."
            if (Test-Path "C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt\\bin\\llvm-config.exe") {
              Write-Host "llvm-config.exe found"
            } else {
              Write-Host "ERROR: llvm-config.exe not found"
              exit 1
            }
            
            Write-Host "Setting LLVM_SYS_180_PREFIX"
            echo "LLVM_SYS_180_PREFIX=C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt" >> $env:GITHUB_ENV
            
            Write-Host "Adding LLVM to PATH"
            echo "C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt\\bin" >> $env:GITHUB_PATH
          } else {
            Write-Host "ERROR: LLVM extraction failed"
            exit 1
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      - name: Build runtime library (Unix)
        if: runner.os != 'Windows'
        run: bash runtime/build.sh

      - name: Build
        run: cargo build --workspace --all-targets
        env:
          LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}
          RUST_TEST_THREADS: 1

      - name: Run tests
        run: cargo test --workspace -- --test-threads=1
        env:
          LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}
          RUST_TEST_THREADS: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and dependencies
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libzstd-dev libpolly-18-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-release:
    name: Release Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            llvm_path: /usr/lib/llvm-18
          - os: macos-latest
            llvm_path: /opt/homebrew/opt/llvm@18
          - os: windows-latest
            llvm_path: C:\llvm-18.1.8-windows-amd64-msvc17-msvcrt
    runs-on: ${{ matrix.os }}
    env:
      LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 zstd
          echo "LIBRARY_PATH=$(brew --prefix zstd)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install LLVM 18 and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y libzstd-dev libpolly-18-dev

      - name: Install LLVM 18 and dependencies (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Downloading LLVM 18.1.8 pre-built package with dev files..."
          $llvmUrl = "https://github.com/vovkos/llvm-package-windows/releases/download/llvm-18.1.8/llvm-18.1.8-windows-amd64-msvc17-msvcrt.7z"
          $llvmArchive = "$env:TEMP\llvm-18.1.8.7z"
          Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmArchive
          
          Write-Host "Extracting LLVM to C:\..."
          7z x $llvmArchive -oC:\\ -y
          
          Write-Host "Verifying LLVM installation..."
          if (Test-Path "C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt") {
            Write-Host "LLVM extracted successfully"
            
            Write-Host "Checking for llvm-config.exe..."
            if (Test-Path "C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt\\bin\\llvm-config.exe") {
              Write-Host "llvm-config.exe found"
            } else {
              Write-Host "ERROR: llvm-config.exe not found"
              exit 1
            }
            
            Write-Host "Setting LLVM_SYS_180_PREFIX"
            echo "LLVM_SYS_180_PREFIX=C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt" >> $env:GITHUB_ENV
            
            Write-Host "Adding LLVM to PATH"
            echo "C:\\llvm-18.1.8-windows-amd64-msvc17-msvcrt\\bin" >> $env:GITHUB_PATH
          } else {
            Write-Host "ERROR: LLVM extraction failed"
            exit 1
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build runtime library (Unix)
        if: runner.os != 'Windows'
        run: bash runtime/build.sh

      - name: Build release
        run: cargo build --workspace --release
        env:
          LLVM_SYS_180_PREFIX: ${{ matrix.llvm_path }}

  no-regressions:
    name: No Regressions Gate
    runs-on: macos-latest
    needs: [test, lint]
    steps:
      - name: All checks passed
        run: echo "✅ No regressions detected. All tests and lints passed."
