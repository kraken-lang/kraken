[workspace]
members = [
    "compiler",
    "runtime",
    #"tools/forge",
    #"tools/fmt",
]
resolver = "2"



# Workspace Package
[workspace.package]
#####################################################
version       = "0.9.3"
readme        = "README.md"
license       = "Apache-2.0"
publish       = false
# ========================
edition       = "2021"
rust-version  = "1.80"
# ========================
documentation = "https://github.com/kraken-lang/kraken"
repository    = "https://github.com/kraken-lang/kraken"
homepage      = "https://github.com/kraken-lang/kraken"
# ========================
authors = [
    "James Gober <me@jamesgober.com>"
]



# Workspace Dependencies
[workspace.dependencies]
#####################################################

# External Dependencies
# ========================
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
llvm-sys = "180"
clap = { version = "4.5", features = ["derive", "cargo"] }

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# File Discovery
glob = "0.3"

# Testing
criterion = "0.5"